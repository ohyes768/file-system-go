# file-system-go 反向代理
# - 1443 = HTTPS（对外主用）
# 上游在 host 跑（systemd）就用 127.0.0.1:8000；
# 在 Docker 跑就改成服务名 file-system-go:8000。

upstream file_system_go {
    # server 127.0.0.1:8000;        # Host 模式
    server file-system-go:8000;   # Docker 模式
    keepalive 16;
}

# ---------- HTTPS 1443 ----------
server {
    listen 1443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 文件存储服务：关闭 body 限制，避免上传大文件被截断
    client_max_body_size 0;

    location / {
        proxy_pass http://file_system_go;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 健康检查直连上游，不打 access log
    location = /health {
        access_log off;
        proxy_pass http://file_system_go;
    }
}