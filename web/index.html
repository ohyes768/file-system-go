<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件管理</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top-bar">
    <h1>文件管理</h1>
    <button type="button" id="logout-btn" class="btn-secondary">退出</button>
  </header>

  <main class="container">
    <section class="upload-section">
      <h2>上传文件</h2>
      <div id="drop-zone" class="drop-zone">
        <p>拖拽文件到此处，或 <label for="file-input" class="file-label">选择文件</label></p>
        <input type="file" id="file-input" hidden>
        <p class="hint">压缩包将自动解压（extract=true）</p>
      </div>
      <div id="upload-progress" class="progress-wrap" hidden>
        <div id="progress-bar" class="progress-bar"></div>
        <span id="progress-text">0%</span>
      </div>
      <p id="upload-status" class="status-msg"></p>
    </section>

    <section class="list-section">
      <div class="list-toolbar">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="search-row">
          <input type="search" id="prefix-search" placeholder="前缀搜索…" autocomplete="off">
          <button type="button" id="search-btn" class="btn-secondary">搜索</button>
          <button type="button" id="refresh-btn" class="btn-secondary">刷新</button>
        </div>
      </div>
      <p class="hint">删除仅支持根目录</p>
      <table class="file-table">
        <thead>
          <tr>
            <th>名称</th>
            <th>类型</th>
            <th>大小</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="file-list">
          <tr><td colspan="4" class="empty">加载中…</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
